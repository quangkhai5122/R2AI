name: clean-baseline-ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  clean-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-clean-lock.txt
      - run: >-
          python -m pytest -p no:cacheprovider
          tests/test_canonical_metrics.py
          tests/test_clean_profile.py
          tests/test_clean_retrieval.py
          tests/test_clean_payload_builder.py -q
      - run: python -m compileall -q vifinqa scripts kaggle
